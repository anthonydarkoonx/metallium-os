[package]
name = "metallium-user"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace]

[dependencies]
metallium-erofs = { path = "../libs/metallium-erofs" }
metallium-lfs = { path = "../libs/metallium-lfs" }
metallium-crypt = { path = "../libs/metallium-crypt" }
metallium-loader = { path = "../libs/metallium-loader" }
# the network service, its driver and the HTTP client: the networking repository, checked out next to this one
# the entropy driver (virtio-rng): its own repository, checked out next to this one
metallium-entropy = { path = "../../metallium-entropy-userspace" }
metallium-net-services = { path = "../../metallium-networking-userspace/services" }
metallium-gfx = { path = "../libs/metallium-gfx" }
metallium-input = { path = "../libs/metallium-input" }
metallium-edit = { path = "../libs/metallium-edit" }
metallium-compact = { path = "../libs/metallium-compact" }
metallium-driver-rt = { path = "../libs/metallium-driver-rt" }
metallium-usb = { path = "../libs/metallium-usb" }

[profile.release]
panic = "abort"
# the kernel gives every boot task a private copy of this image: small matters (about 26 copies). The drawing crates, where the
# console spends its time, are optimised for speed instead.
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package.metallium-gfx]
opt-level = 3

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `desktop` is set by the Makefile when the image is built with a desktop (DESKTOP=<path>)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(desktop)', 'cfg(greeter)'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "metallium-programs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Programs that run on Metallium-OS as ordinary tasks (started with SPAWN from images in the system partition)"

[workspace]

[dependencies]
metallium-loader = { path = "../libs/metallium-loader" }
metallium-map = { path = "../libs/metallium-map" }
metallium-crypt = { path = "../libs/metallium-crypt" }

# The network programs (tests and tools for the network service) are in the networking repository, checked out next to this one.
[[bin]]
name = "nettest"
path = "../../metallium-networking-userspace/programs/nettest.rs"

[[bin]]
name = "netcheck"
path = "../../metallium-networking-userspace/programs/netcheck.rs"

[[bin]]
name = "fetch"
path = "../../metallium-networking-userspace/programs/fetch.rs"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
